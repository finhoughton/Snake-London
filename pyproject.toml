[project]
name = "snake-london"
version = "0.1.0"
# 3.12+ is a hard floor: the jloxgame submodule uses PEP 695 generic syntax
# (`class JLOXBot[ContextType: GameContext]`), which 3.11 cannot parse.
requires-python = ">=3.12"
dependencies = [
    "resvg-py>=0.5",
    # discord is imported directly by game.py/main.py, not just by the bot layer,
    # so the engine does not import at all without it. Matches jloxgame/requirements.txt.
    # py-cord currently caps itself at <3.15.
    "py-cord>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.4",
]

[tool.setuptools]
py-modules = []
